[project]
name = "halyk-agent"
version = "0.1.0"
description = "Evidence-first decision agent for the Halyk Bank Agentic Challenge"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Halyk Agentic Challenge Team" },
]
dependencies = [
  "charset-normalizer>=3.3.0",
  "fastapi>=0.115.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "pypdf>=6.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
halyk-agent = "halyk_agent.app.cli:main"

[project.optional-dependencies]
full = [
    "docling==2.118.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "reportlab>=4.0.0",
  "ruff>=0.6.0",
  "types-openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyk_agent"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "docling: tests that require the optional Docling full extra",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["halyk_agent"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
  "docling",
  "docling.*",
]
ignore_missing_imports = true
follow_imports = "skip"