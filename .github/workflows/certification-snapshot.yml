name: certification-source-snapshot

on:
  push:
    branches:
      - stage-10/competition-certification

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source snapshot
        run: |
          tar --exclude=.git --exclude=.venv --exclude=.mypy_cache --exclude=.pytest_cache --exclude=.ruff_cache -czf /tmp/halyk-stage10-final.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: halyk-stage10-final-source-${{ github.sha }}
          path: /tmp/halyk-stage10-final.tar.gz
          retention-days: 1
