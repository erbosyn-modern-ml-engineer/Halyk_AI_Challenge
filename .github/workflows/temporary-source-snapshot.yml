name: temporary-source-snapshot

on:
  push:
    branches:
      - stage-10.1/opus-targeted-fixes

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack exact source tree
        run: tar --exclude=.git --exclude=.venv -czf /tmp/halyk-opus-fix-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: halyk-opus-fix-source
          path: /tmp/halyk-opus-fix-source.tar.gz
          if-no-files-found: error
