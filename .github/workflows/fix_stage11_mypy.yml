name: fix-stage11-mypy

on:
  push:
    branches:
      - stage-11/bounded-semantic-hardening
    paths:
      - .github/fix-stage11-mypy.ready

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Apply type-only fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("src/halyk_agent/adapters/routing/io.py")
          t = p.read_text(encoding="utf-8")
          t = t.replace("from collections.abc import Iterable\n", "from collections.abc import Iterable, Sequence\n")
          t = t.replace("def _header_mapping(header: list[object]) -> dict[str, int]:", "def _header_mapping(header: Sequence[object]) -> dict[str, int]:")
          t = t.replace("def _row_value(row: list[object], mapping: dict[str, int], name: str) -> str:", "def _row_value(row: Sequence[object], mapping: dict[str, int], name: str) -> str:")
          t = t.replace("    rows: Iterable[list[object]],\n", "    rows: Iterable[Sequence[object]],\n")
          t = t.replace(
              "        sheet = workbook.active\n        rows = [list(row) for row in sheet.iter_rows(values_only=True)]\n",
              "        sheet = workbook.active\n        if sheet is None:\n            raise RoutingIOError(\"XLSX ledger has no active worksheet\", code=\"LEDGER_SCHEMA\")\n        rows = [list(row) for row in sheet.iter_rows(values_only=True)]\n",
          )
          p.write_text(t, encoding="utf-8", newline="\n")

          p = Path("src/halyk_agent/preflight/discover.py")
          t = p.read_text(encoding="utf-8")
          t = t.replace("import re\nfrom pathlib import Path\n", "import re\nfrom collections.abc import Sequence\nfrom pathlib import Path\n")
          t = t.replace("def _canonical_header(header: list[object]) -> set[str]:", "def _canonical_header(header: Sequence[object]) -> set[str]:")
          t = t.replace("def _csv_header(data: bytes) -> list[str] | None:", "def _csv_header(data: bytes) -> Sequence[object] | None:")
          t = t.replace("def _xlsx_header(data: bytes) -> list[object] | None:", "def _xlsx_header(data: bytes) -> Sequence[object] | None:")
          t = t.replace(
              "        sheet = workbook.active\n        row = next(sheet.iter_rows(min_row=1, max_row=1, values_only=True), None)\n",
              "        sheet = workbook.active\n        if sheet is None:\n            return None\n        row = next(sheet.iter_rows(min_row=1, max_row=1, values_only=True), None)\n",
          )
          t = t.replace(
              "def _looks_like_ledger(path: Path, data: bytes) -> bool:\n    suffix = path.suffix.casefold()\n",
              "def _looks_like_ledger(path: Path, data: bytes) -> bool:\n    suffix = path.suffix.casefold()\n    header: Sequence[object] | None\n",
          )
          p.write_text(t, encoding="utf-8", newline="\n")

          p = Path("src/halyk_agent/domain/fact_extraction/conflicts.py")
          t = p.read_text(encoding="utf-8")
          t = t.replace("        value = {\n            \"disposition\": payload.disposition.value,\n", "        value: dict[str, Any] = {\n            \"disposition\": payload.disposition.value,\n", 1)
          p.write_text(t, encoding="utf-8", newline="\n")

          p = Path("src/halyk_agent/config.py")
          t = p.read_text(encoding="utf-8")
          marker = '    app_name: str = Field(default="halyk-agent")\n'
          if '    stage: int = Field(default=11, ge=1)\n' not in t:
              t = t.replace(marker, marker + '    stage: int = Field(default=11, ge=1)\n')
          p.write_text(t, encoding="utf-8", newline="\n")
          PY
          uv sync --frozen --extra full --extra retrieval-full
          uv run ruff check . --fix
          uv run ruff format .
          uv run ruff check .
          uv run mypy src
          git diff --check
          rm -f .github/fix-stage11-mypy.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage11): restore Python 3.12 type gate"
          git push origin HEAD:stage-11/bounded-semantic-hardening
