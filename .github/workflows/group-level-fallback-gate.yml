name: group-level-fallback-gate

on:
  push:
    branches:
      - stage-10.4/fallback-generalization

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[group-level-gate-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10.4/fallback-generalization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync environment
        run: uv sync --frozen --extra full --extra retrieval-full
      - name: Apply narrowing gate
        run: |
          python tools/apply_group_level_gate.py
          uv run ruff format src/halyk_agent/solver/fallbacks.py tests/solver/test_competitive_fallbacks.py
          uv run ruff check --fix src/halyk_agent/solver/fallbacks.py tests/solver/test_competitive_fallbacks.py
      - name: Targeted tests
        run: uv run pytest -q tests/solver/test_competitive_fallbacks.py
      - name: Strict mypy
        run: uv run mypy src
      - name: Commit verified gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/halyk_agent/solver/fallbacks.py tests/solver/test_competitive_fallbacks.py
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: require group-level semantics for GROUP_CAPEX fallback [group-level-gate-applied]"
          git push origin HEAD:stage-10.4/fallback-generalization
