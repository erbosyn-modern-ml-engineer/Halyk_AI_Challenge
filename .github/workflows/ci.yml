name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen --extra full --extra retrieval-full

      - name: Normalize causal evidence patch
        if: github.event_name == 'push' && github.ref_name == 'stage-7/solver-integration'
        run: |
          uv run ruff format src/halyk_agent/solver/evidence.py tests/solver/test_causal_evidence.py
          uv run ruff check --fix src/halyk_agent/solver/evidence.py tests/solver/test_causal_evidence.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/halyk_agent/solver/evidence.py tests/solver/test_causal_evidence.py
            git commit -m "style(solver): normalize causal evidence regression"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q
