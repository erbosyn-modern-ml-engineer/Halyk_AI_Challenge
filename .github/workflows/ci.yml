name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Apply one-time strict typing closures
        if: github.event_name == 'push' && github.ref_name == 'stage-7/solver-integration'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected typing closure pattern missing: {path}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          replace(
              "src/halyk_agent/app/reproduction.py",
              '''def _stable_pipeline_payload(path: Path) -> dict[str, object]:\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    if not isinstance(payload, dict):\n        raise ReproductionError("pipeline manifest is not a JSON object")\n    return {key: value for key, value in payload.items() if key != "run_id"}\n''',
              '''def _stable_pipeline_payload(path: Path) -> dict[str, object]:\n    payload = json.loads(path.read_text(encoding="utf-8"))\n    if not isinstance(payload, dict):\n        raise ReproductionError("pipeline manifest is not a JSON object")\n    return {key: value for key, value in payload.items() if key != "run_id"}\n\n\ndef _required_int(payload: dict[str, object], key: str) -> int:\n    value = payload.get(key)\n    if isinstance(value, bool) or not isinstance(value, (int, str)):\n        raise ReproductionError(f"pipeline manifest field {key!r} is not an integer")\n    try:\n        return int(value)\n    except ValueError as exc:\n        raise ReproductionError(\n            f"pipeline manifest field {key!r} is not an integer"\n        ) from exc\n''',
          )
          replace(
              "src/halyk_agent/app/reproduction.py",
              '''        run_a_source_reads=int(stable_a["source_read_count"]),\n        run_b_source_reads=int(stable_b["source_read_count"]),''',
              '''        run_a_source_reads=_required_int(stable_a, "source_read_count"),\n        run_b_source_reads=_required_int(stable_b, "source_read_count"),''',
          )
          replace(
              "src/halyk_agent/solver/fallbacks.py",
              '''input_id=deterministic_id("stage8-fallback", "P5", "GROUP_CAPEX", amount),''',
              '''input_id=deterministic_id("stage8-fallback", "P5", "GROUP_CAPEX", str(amount)),''',
          )
          replace(
              "src/halyk_agent/solver/fallbacks.py",
              '''    updated_readiness: list[DefinitionReadinessEntry] = []\n    for entry in readiness:\n        if entry.definition_id == definition_id:\n            updated_readiness.append(\n                entry.model_copy(\n                    update={\n                        "status": SelectorReadinessStatus.READY,\n                        "reason_code": "STAGE8_PPE_ROLL_FORWARD_RESIDUAL",\n                        "unresolved_selectors": (),\n                    }\n                )\n            )\n        else:\n            updated_readiness.append(entry)''',
              '''    updated_readiness: list[DefinitionReadinessEntry] = []\n    for readiness_entry in readiness:\n        if readiness_entry.definition_id == definition_id:\n            updated_readiness.append(\n                readiness_entry.model_copy(\n                    update={\n                        "status": SelectorReadinessStatus.READY,\n                        "reason_code": "STAGE8_PPE_ROLL_FORWARD_RESIDUAL",\n                        "unresolved_selectors": (),\n                    }\n                )\n            )\n        else:\n            updated_readiness.append(readiness_entry)''',
          )
          replace(
              "src/halyk_agent/solver/evidence.py",
              '''        category = map_category_label(proposed)\n        if category is None:\n            return None\n        updated = _recompute_category_fields(inp, category=category, description=description)''',
              '''        proposed_category = map_category_label(proposed)\n        if proposed_category is None:\n            return None\n        updated = _recompute_category_fields(\n            inp, category=proposed_category, description=description\n        )''',
          )
          replace(
              "src/halyk_agent/app/cli.py",
              '''            report = verify_reproduction_pair(args.run_a, args.run_b, args.output)''',
              '''            reproduction_report = verify_reproduction_pair(\n                args.run_a, args.run_b, args.output\n            )''',
          )
          replace(
              "src/halyk_agent/app/cli.py",
              '''        print(f"deterministic={report.deterministic}")\n        print(f"submission_sha256={report.submission_sha256}")''',
              '''        print(f"deterministic={reproduction_report.deterministic}")\n        print(f"submission_sha256={reproduction_report.submission_sha256}")''',
          )
          PY

      - name: Sync locked environment
        run: uv sync --frozen --extra full --extra retrieval-full

      - name: Normalize and publish typing closures
        if: github.event_name == 'push' && github.ref_name == 'stage-7/solver-integration'
        run: |
          uv run ruff format .
          uv run ruff check --fix --unsafe-fixes .
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/halyk_agent/app/reproduction.py \
                    src/halyk_agent/app/cli.py \
                    src/halyk_agent/solver/fallbacks.py \
                    src/halyk_agent/solver/evidence.py
            git commit -m "fix(solver): satisfy strict Stage 7-9 typing"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q
