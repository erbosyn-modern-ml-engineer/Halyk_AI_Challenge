name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen --extra full --extra retrieval-full

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q

      - name: Package source snapshot
        if: always() && github.event_name == 'push' && github.ref_name == 'stage-7/solver-integration'
        run: |
          tar --exclude=.git --exclude=.venv --exclude=work -czf /tmp/halyk-source.tar.gz .

      - name: Upload source snapshot
        if: always() && github.event_name == 'push' && github.ref_name == 'stage-7/solver-integration'
        uses: actions/upload-artifact@v4
        with:
          name: halyk-source-${{ github.sha }}
          path: /tmp/halyk-source.tar.gz
          retention-days: 1
