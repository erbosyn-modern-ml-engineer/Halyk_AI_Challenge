name: private-hardening-run
on:
  push:
    branches:
      - stage-11/private-hardening
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: stage-11/private-hardening
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/_semantic_patch.py
      - run: python -m pip install --disable-pip-version-check ruff==0.16.1
      - run: ruff check --fix src || true
      - run: ruff format src
      - run: python -m compileall -q src
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat: wire bounded DeepSeek semantic classification"
          git push origin HEAD:stage-11/private-hardening
