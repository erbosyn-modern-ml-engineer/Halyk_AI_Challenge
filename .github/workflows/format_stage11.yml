name: format-stage11

on:
  push:
    branches:
      - stage-11/bounded-semantic-hardening
    paths:
      - .github/format-stage11.ready

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.1
      - name: Normalize lint-safe formatting
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix --exit-zero
          ruff format .
          python - <<'PY'
          from pathlib import Path
          path = Path("src/halyk_agent/domain/covenants/semantic_formula.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    "do not invent transaction data, FX, dates, thresholds, comparator semantics, or missing facts. "\n',
              '    "do not invent transaction data, FX, dates, thresholds, comparator semantics, "\n'
              '    "or missing facts. "\n',
          )
          text = text.replace(
              '    "source_quote must be an exact contiguous quote copied from the clause that supports the metric. "\n',
              '    "source_quote must be an exact contiguous quote copied from the clause that "\n'
              '    "supports the metric. "\n',
          )
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          ruff format .
          ruff check .
          git diff --check
          rm -f .github/format-stage11.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(stage11): normalize hardening changes"
            git push origin HEAD:stage-11/bounded-semantic-hardening
          fi
