name: opus-targeted-fixes

on:
  push:
    branches:
      - stage-10.1/opus-targeted-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[opus-fixes-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-10.1/opus-targeted-fixes

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Sync locked environment
        run: uv sync --frozen --extra full --extra retrieval-full

      - name: Apply confirmed red-team fixes
        run: python tools/apply_opus_targeted_fixes.py

      - name: Repair generated regressions and source guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          test_path = Path("tests/solver/test_competitive_fallbacks.py")
          text = test_path.read_text(encoding="utf-8")
          old = '+ ("narrative " * 400) + "\nRevaluations were recorded.\nNote 8 — Other\n"'
          new = '+ ("narrative " * 400) + "\\nRevaluations were recorded.\\nNote 8 — Other\\n"'
          if old not in text:
              raise SystemExit("generated long-note literal not found")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          source_path = Path("src/halyk_agent/domain/fact_extraction/text_locate.py")
          source = source_path.read_text(encoding="utf-8")
          start = source.index("def parse_money(text: str) -> tuple[Decimal, str] | None:\n")
          end = source.index("def parse_percentage(text: str) -> Decimal | None:\n", start)
          replacement = '''def parse_money(text: str) -> tuple[Decimal, str] | None:
              """Parse the first complete money token without shorter-prefix recovery."""

              # Suffix ISO notation (``1 234,56 USD``) is legitimate, but it may
              # not be used to rescue a malformed currency-prefixed token such as
              # ``$300,00 USD``.
              suffix = _SUFFIX_MONEY_RE.search(text)
              if suffix is not None:
                  before = text[: suffix.start()]
                  prior_currency = re.search(
                      r"[$€£¥₸]|\\b(?:USD|EUR|GBP|KZT|RUB|JPY)\\b", before, re.IGNORECASE
                  )
                  prefix = before.rstrip()
                  bad_numeric_continuation = bool(
                      prefix and (prefix[-1].isdigit() or prefix[-1] in ",.'`")
                  )
                  if prior_currency is None and not bad_numeric_continuation:
                      try:
                          return _normalize_number(suffix.group("num")), suffix.group("code").upper()
                      except ValueError:
                          return None

              scan = scan_money_quantities(text)
              if scan.has_malformed:
                  return None
              if scan.quantities:
                  quantity = scan.quantities[0]
                  if quantity.currency is None:
                      return None
                  return quantity.value, quantity.currency
              return None


          '''
          source = source[:start] + textwrap.dedent(replacement) + source[end:]
          source = source.replace("r\"(?<![\\w,.'’`])\"", "r\"(?<![\\w,.'`])\"")
          source_path.write_text(source, encoding="utf-8", newline="\n")

          fallback_path = Path("src/halyk_agent/solver/fallbacks.py")
          fallback = fallback_path.read_text(encoding="utf-8")
          duplicate = (
              "@dataclass(frozen=True, slots=True)\n"
              "@dataclass(frozen=True, slots=True)\n"
          )
          if duplicate not in fallback:
              raise SystemExit("generated duplicate fallback dataclass decorator not found")
          fallback = fallback.replace(duplicate, "@dataclass(frozen=True, slots=True)\n", 1)

          old_helper = '''def _money_after_label(note: str, match: re.Match[str]) -> tuple[Decimal, str] | None:
              # Keep the window narrow enough that a missing value cannot bind to the next
              # row, while the money parser itself enforces complete-token semantics.
              return parse_money(note[match.end() : match.end() + 120])
          '''
          new_helper = '''def _money_after_label(note: str, match: re.Match[str]) -> tuple[Decimal, str] | None:
              # A PPE row may only bind to money on that same logical line.  Searching
              # farther would let a malformed opening value borrow a later valid row.
              remainder = note[match.end() :]
              line = remainder.splitlines()[0] if remainder else ""
              return parse_money(line[:120])
          '''
          old_helper = textwrap.dedent(old_helper)
          new_helper = textwrap.dedent(new_helper)
          if old_helper not in fallback:
              raise SystemExit("generated P5 money helper not found")
          fallback = fallback.replace(old_helper, new_helper, 1)
          fallback_path.write_text(fallback, encoding="utf-8", newline="\n")
          PY

      - name: Normalize changed Python
        run: |
          uv run ruff format \
            src/halyk_agent/domain/covenants/parse.py \
            src/halyk_agent/domain/fact_extraction/text_locate.py \
            src/halyk_agent/preflight/quarantine.py \
            src/halyk_agent/preflight/discover.py \
            src/halyk_agent/app/transactions.py \
            src/halyk_agent/app/evaluation.py \
            src/halyk_agent/solver/pipeline.py \
            src/halyk_agent/solver/submission/final.py \
            src/halyk_agent/solver/solve.py \
            src/halyk_agent/solver/fallbacks.py \
            src/halyk_agent/solver/evidence.py \
            tests/facts/test_parse_money_contract.py \
            tests/covenants/test_opus_redteam_regressions.py \
            tests/ingestion/test_template_ambiguity.py \
            tests/solver/test_partial_publication.py \
            tests/solver/test_causal_evidence.py \
            tests/solver/test_competitive_fallbacks.py
          uv run ruff check --fix \
            src/halyk_agent/domain/covenants/parse.py \
            src/halyk_agent/domain/fact_extraction/text_locate.py \
            src/halyk_agent/preflight/quarantine.py \
            src/halyk_agent/preflight/discover.py \
            src/halyk_agent/app/transactions.py \
            src/halyk_agent/app/evaluation.py \
            src/halyk_agent/solver/pipeline.py \
            src/halyk_agent/solver/submission/final.py \
            src/halyk_agent/solver/solve.py \
            src/halyk_agent/solver/fallbacks.py \
            src/halyk_agent/solver/evidence.py \
            tests/facts/test_parse_money_contract.py \
            tests/covenants/test_opus_redteam_regressions.py \
            tests/ingestion/test_template_ambiguity.py \
            tests/solver/test_partial_publication.py \
            tests/solver/test_causal_evidence.py \
            tests/solver/test_competitive_fallbacks.py

      - name: Targeted destructive-audit regressions
        run: |
          uv run pytest -q \
            tests/facts/test_parse_money_contract.py \
            tests/covenants/test_opus_redteam_regressions.py \
            tests/ingestion/test_template_ambiguity.py \
            tests/solver/test_partial_publication.py \
            tests/solver/test_causal_evidence.py \
            tests/solver/test_competitive_fallbacks.py

      - name: Strict typecheck
        run: uv run mypy src

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: close confirmed Opus red-team blockers and highs [opus-fixes-applied]"
          git push origin HEAD:stage-10.1/opus-targeted-fixes
