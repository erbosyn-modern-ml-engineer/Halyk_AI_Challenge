name: source-snapshot

on:
  push:
    branches:
      - stage-11/bounded-semantic-hardening

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
