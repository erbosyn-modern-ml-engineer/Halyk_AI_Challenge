name: apply-hardening-patch

on:
  push:
    branches:
      - stage-11/bounded-semantic-hardening
    paths:
      - .github/hardening.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/hardening.patch.part-* > /tmp/hardening.patch
          patch -p1 < /tmp/hardening.patch
          rm -f .github/hardening.patch.part-* .github/hardening.ready
          rm -f .github/workflows/source_snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(stage11): harden bounded semantic fallbacks"
          git push origin HEAD:stage-11/bounded-semantic-hardening
