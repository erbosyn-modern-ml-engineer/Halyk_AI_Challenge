name: opus-targeted-fixes-v2

on:
  push:
    branches:
      - stage-10.1/opus-targeted-fixes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[opus-fixes-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10.1/opus-targeted-fixes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync environment
        run: uv sync --frozen --extra full --extra retrieval-full
      - name: Apply fixes
        run: |
          python tools/apply_opus_targeted_fixes.py
          python tools/repair_opus_targeted_fixes.py
          uv run ruff format src tests
          uv run ruff check --fix src tests
      - name: Targeted regressions
        run: |
          uv run pytest -q tests/facts/test_parse_money_contract.py tests/covenants/test_opus_redteam_regressions.py tests/ingestion/test_template_ambiguity.py tests/solver/test_partial_publication.py tests/solver/test_causal_evidence.py tests/solver/test_competitive_fallbacks.py
      - name: Strict mypy
        run: uv run mypy src
      - name: Commit verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: close confirmed Opus red-team blockers and highs [opus-fixes-applied]"
          git push origin HEAD:stage-10.1/opus-targeted-fixes
