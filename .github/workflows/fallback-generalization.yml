name: fallback-generalization

on:
  push:
    branches:
      - stage-10.4/fallback-generalization
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[fallback-generalization-applied]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-10.4/fallback-generalization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync environment
        run: uv sync --frozen --extra full --extra retrieval-full
      - name: Apply semantic fallback patch
        run: |
          python tools/apply_fallback_generalization.py
          uv run ruff format src tests
          uv run ruff check --fix src tests
      - name: Targeted fallback and evidence regressions
        run: |
          uv run pytest -q tests/solver/test_competitive_fallbacks.py tests/solver/test_fallback_evidence_wiring.py tests/solver/test_causal_evidence.py tests/solver/test_partial_publication.py
      - name: Strict mypy
        run: uv run mypy src
      - name: Commit verified production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix: generalize bounded fallbacks and evidence wiring [fallback-generalization-applied]"
          git push origin HEAD:stage-10.4/fallback-generalization
