services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: halyk-postgres
    environment:
      POSTGRES_DB: halyk
      POSTGRES_USER: halyk
      POSTGRES_PASSWORD: halyk
    ports:
      - "5432:5432"
    volumes:
      - halyk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halyk -d halyk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: halyk-redis
    ports:
      - "6379:6379"
    volumes:
      - halyk_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  halyk_postgres_data:
  halyk_redis_data:
